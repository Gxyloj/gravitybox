name: Package Windows (Artifact Only)

on:
  workflow_dispatch:
    inputs:
      include_installer:
        description: 'Build user-level NSIS installer (.exe) alongside portable .zip'
        required: false
        type: boolean
        default: true

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Verify & Package Windows x64 Artifacts
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            windows/app/package-lock.json

      - name: Cache Cargo registry & build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            windows/win-helper/target
            windows/app/src-tauri/target
          key: cargo-win-pkg-${{ hashFiles('windows/win-helper/Cargo.lock', 'windows/app/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-win-pkg-
            cargo-win-

      - name: Install Node dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix windows/app ci --ignore-scripts --no-audit --no-fund

      - name: Build Win32 helper release binary
        working-directory: windows/win-helper
        run: cargo build --release

      - name: Run full Windows verification gate
        run: npm run verify

      - name: Ensure NSIS compiler is available
        env:
          INCLUDE_INSTALLER: ${{ inputs.include_installer }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INCLUDE_INSTALLER -ne 'true') {
            Write-Host 'Skipping NSIS setup (include_installer=false).'
            exit 0
          }
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe') -and -not (Test-Path 'C:\Program Files\NSIS\makensis.exe') -and -not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          $makensis = @(
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe',
            (Get-Command makensis -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $makensis) { throw 'makensis.exe not found after installing NSIS' }
          Write-Host "Using NSIS: $makensis ($(& $makensis /VERSION))"

      - name: Build self-contained Windows packages
        env:
          INCLUDE_INSTALLER: ${{ inputs.include_installer }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INCLUDE_INSTALLER -eq 'true') {
            node tools/package-win.mjs --installer
          } else {
            node tools/package-win.mjs
          }

      - name: Write SHA-256 summary for human verification
        env:
          INCLUDE_INSTALLER: ${{ inputs.include_installer }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = if ($pkg.windowsReleaseVersion) { [string]$pkg.windowsReleaseVersion } else { [string]$pkg.version }
          $files = @(
            "成品/GravityBox-$ver-win-x64.zip",
            "成品/GravityBox-$ver-win-x64.zip.sha256"
          )
          if ($env:INCLUDE_INSTALLER -eq 'true') {
            $files += @(
              "成品/GravityBox-$ver-win-x64-setup.exe",
              "成品/GravityBox-$ver-win-x64-setup.exe.sha256"
            )
          }
          $lines = @(
            "## GravityBox v$ver Windows x64 Packaging Artifacts",
            "",
            "Artifacts are uploaded for manual acceptance only (no automated GitHub Release is published).",
            "",
            '```text'
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "Missing expected packaged artifact: $f" }
            if ($f.EndsWith('.sha256')) {
              $lines += (Get-Content $f -Raw).Trim()
            }
          }
          $lines += '```'
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload Windows packaging artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gravitybox-windows-x64
          path: 成品/GravityBox-*-win-*
          retention-days: 7
          if-no-files-found: error
